<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zestie AI | Enterprise Demo</title>
    <style>
        /* Desain Dark Mode Kelas Premium */
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .chat-container { 
            width: 100%; 
            max-width: 400px; 
            background: #161b22; 
            border-radius: 12px; 
            border: 1px solid #30363d; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 85vh; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.8); 
        }
        .header { 
            padding: 18px; 
            background: #21262d; 
            border-bottom: 1px solid #30363d; 
            text-align: center; 
            font-weight: 600; 
            letter-spacing: 0.5px;
        }
        .header span { color: #2ea043; }
        .chat-box { 
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 10px; 
            max-width: 85%; 
            line-height: 1.5; 
            font-size: 15px;
        }
        .bot-msg { 
            background: #21262d; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px; 
            border: 1px solid #30363d;
        }
        .user-msg { 
            background: #2ea043; 
            color: #ffffff; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px; 
        }
        .input-area { 
            display: flex; 
            padding: 14px; 
            border-top: 1px solid #30363d; 
            background: #161b22; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #ffffff; 
            outline: none; 
            font-size: 14px;
        }
        input:focus { border-color: #2ea043; }
        button { 
            background: #2ea043; 
            color: white; 
            border: none; 
            padding: 0 20px; 
            margin-left: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: 0.2s;
        }
        button:hover { background: #238636; }
        /* Modifikasi Scrollbar biar mulus */
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header"><span>●</span> Zestie AI Demo</div>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">
                halo, zestie ai dimari.
                <br><br>
                mau ngetes kepintaran otak kita buat industri apa hari ini?
                <br><br>
                1. kargo & logistik<br>
                2. klinik kecantikan<br>
                3. brand f&b / retail
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ketik pesan..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        // Ini otak sementara buat nangkep inputan di Web
        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            if(!text) return;

            // Nampilin pesan yang diketik klien
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-msg';
            userMsg.innerText = text;
            chatBox.appendChild(userMsg);

            // Bersihin kotak ketikan
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // NANTI KITA SAMBUNGIN KE BACKEND NODE.JS DISINI
            // Buat sekarang, kasih balasan bohongan (dummy) dulu
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot-msg';
                botMsg.innerText = "sistem backend lagi dikalibrasi. sabar ya.";
                chatBox.appendChild(botMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        function handleEnter(e) {
            if(e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
